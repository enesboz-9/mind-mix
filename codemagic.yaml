workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
      android_signing:
        - mind_mix_keystore   # Codemagic > Code signing identities'te bu isimle yükle
      groups:
        - google_play            # (opsiyonel) GCLOUD_SERVICE_ACCOUNT_CREDENTIALS burada
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Paketleri al
        script: flutter pub get
      - name: Analiz
        script: flutter analyze
        ignore_failure: true
      - name: Test
        script: flutter test
        ignore_failure: true
      - name: AAB derle
        script: |
          flutter build appbundle --release \
            --build-number=$(($BUILD_NUMBER + 0))
      - name: APK derle (elle test için)
        script: |
          flutter build apk --release \
            --build-number=$(($BUILD_NUMBER + 0))
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - enesboz201@gmail.com
        notify:
          success: true
          failure: true
      # Google Play hazır olunca aşağıdaki bloğun yorumunu kaldır:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_to_google_play: false

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: codemagic   # Codemagic > Team integrations > App Store Connect'te bu isimle ekle
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing          # içinde CERTIFICATE_PRIVATE_KEY (Secure işaretli) olacak
      vars:
        BUNDLE_ID: "com.bnovative.mindMix"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Paketleri al
        script: flutter pub get
      - name: CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Keychain hazirla
        script: keychain initialize
      - name: Sertifika ve profili Apple'dan al/olustur
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Sertifikalari keychain'e ekle
        script: keychain add-certificates
      - name: Imzalama profillerini ayarla
        script: xcode-project use-profiles
      - name: IPA derle
        script: |
          flutter build ipa --release \
            --build-number=$(($BUILD_NUMBER + 0)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - enesboz201@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

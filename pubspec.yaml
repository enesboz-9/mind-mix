name: mind_mix
description: Altı hızlı zeka oyunu tek uygulamada. Çevrimdışı, reklamsız.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#12141C"
  adaptive_icon_foreground: "assets/logo/icon_foreground.png"
